<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love OS v1.0</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="bootScreen" class="boot-screen">
    <div class="boot-box">
      <h1>Love OS v1.0</h1>
      <p id="bootText">Initializing system...</p>
      <div class="loading-bar">
        <div class="loading-fill"></div>
      </div>
    </div>
  </div>

  <main id="desktop" class="desktop hidden">

    <section class="hero">
      <h1>Welcome Bal &#10084;&#65039;</h1>
      <p>A special little world made just for you.</p>
    </section>

    <section class="apps" aria-label="Love OS apps">
      <button class="app" type="button" data-app="memories"><span class="app-icon">&#128248;</span><span>Memories</span></button>
      <button class="app" type="button" data-app="letter"><span class="app-icon">&#128140;</span><span>Love Letter</span></button>
      <button class="app" type="button" data-app="reasons"><span class="app-icon">&#127804;</span><span>Reasons</span></button>
      <button class="app" type="button" data-app="future"><span class="app-icon">&#127769;</span><span>Future</span></button>
      <button class="app" type="button" data-app="surprise"><span class="app-icon">&#127873;</span><span>Surprise</span></button>
    </section>

    <section id="window" class="window hidden">
      <div class="window-top">
        <span></span><span></span><span></span>
        <button type="button" aria-label="Close app" onclick="closeApp()">&times;</button>
      </div>
      <div id="windowContent" class="window-content"></div>
    </section>

  </main>

  <div class="assistant hidden is-closed" id="assistant">
    <button class="assistant-toggle" id="assistantToggle" type="button" aria-expanded="false" aria-controls="assistantPanel">
      <span>Chat</span>
    </button>

    <section class="assistant-panel" id="assistantPanel" aria-label="Love OS assistant">
      <div class="assistant-header">
        <div>
          <strong>Love Assistant</strong>
          <span>Ready when you are</span>
        </div>
        <button type="button" id="assistantClose" aria-label="Close assistant">&times;</button>
      </div>

      <div class="chat-box" id="chatBox">
        <div class="bot-msg">Hi! I'm Joseph's love assistant. Click an app or ask me something &#10084;&#65039;</div>
      </div>

      <div id="quickReplies" class="quick-replies" aria-label="Quick assistant actions">
        <button type="button" data-app="memories" data-answer="Tell me about the memories">Memories</button>
        <button type="button" data-app="letter" data-answer="Show me the love letter">Love letter</button>
        <button type="button" data-app="reasons" data-answer="What are your reasons?">Reasons</button>
        <button type="button" data-app="surprise" data-answer="Open the surprise">Surprise</button>
      </div>

      <div class="chat-input">
        <input type="text" id="userInput" placeholder="Ask me..." autocomplete="off" />
        <button type="button" id="sendMessageBtn">Send</button>
      </div>
    </section>

    <div class="stickman" role="button" tabindex="0" aria-label="Ask the assistant for a hint">
      <div class="head">
        <div class="eye left-eye"></div>
        <div class="eye right-eye"></div>
        <div class="smile"></div>
      </div>
      <div class="body-line"></div>
      <div class="arm left-arm"></div>
      <div class="arm right-arm"></div>
      <div class="leg left-leg"></div>
      <div class="leg right-leg"></div>
    </div>
  </div>

  <div id="hearts"></div>

  <script src="script.js"></script>
</body>
</html>
